<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Safe Shorts</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .shorts-wrapper {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100%;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
        .next-bar {
            position: absolute;
            bottom: 40px;
            right: 20px;
            z-index: 999;
        }
        .btn-next {
            background: rgba(255, 255, 255, 0.25);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="shorts-wrapper" id="player-container">
        <!-- Aici se va încărca scurtătura de Short -->
    </div>

    <div class="next-bar">
        <button class="btn-next" onclick="nextShort()">Următorul ➡️</button>
    </div>

    <script>
        let playlist = [];
        let currentIndex = 0;

        async function loadPlaylist() {
            try {
                let response = await fetch('playlist.json');
                playlist = await response.json();
                if (playlist.length > 0) {
                    currentIndex = 0;
                    renderShort();
                }
            } catch (e) {
                console.log("Eroare la încărcare");
            }
        }

        function renderShort() {
            if (playlist.length === 0) return;
            let current = playlist[currentIndex];
            
            let container = document.getElementById('player-container');
            // Folosim link-ul nativ de embed vertical specific pentru YouTube Shorts
            container.innerHTML = `
                <iframe src="https://www.youtube.com/embed/${current.id}?autoplay=1&controls=0&modestbranding=1&loop=1&playlist=${current.id}" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            `;
        }

        function nextShort() {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex + 1) % playlist.length;
            renderShort();
        }

        // Încarcă la pornire
        loadPlaylist();
    </script>
</body>
</html>
