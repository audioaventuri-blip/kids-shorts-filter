<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Skills Feed</title>
    <style>
        body {
            margin: 0;
            padding: 15px;
            background-color: #0f0f0f;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        h2 {
            text-align: center;
            font-size: 18px;
            color: #aaa;
        }
        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: #212121;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-decoration: none;
            color: white;
            display: block;
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .card-title {
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Videoclipuri Instructive</h2>
    <div class="feed-container" id="feed">
        Se încarcă lista...
    </div>

    <script>
        async function loadFeed() {
            try {
                let response = await fetch('playlist.json');
                let videos = await response.json();
                let container = document.getElementById('feed');
                container.innerHTML = "";

                videos.forEach(v => {
                    let card = document.createElement('a');
                    card.className = "card";
                    // Folosim link-ul oficial direct de YouTube care garantează că nu dă niciodată eroare
                    card.href = `https://www.youtube.com/watch?v=${v.id}`;
                    card.target = "_blank";
                    
                    card.innerHTML = `
                        <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="thumbnail">
                        <div class="card-title">${v.title}</div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                document.getElementById('feed').innerText = "Eroare la încărcarea fluxului.";
            }
        }

        loadFeed();
    </script>
</body>
</html>
