<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Skills Feed</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #player {
            width: 100%;
            max-width: 450px;
            height: 80vh;
        }
        .info {
            padding: 10px;
            font-size: 16px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="info" id="video-title">Se încarce conținutul...</div>
    <div id="player"></div>

    <!-- Încărcăm scriptul oficial de YouTube Iframe API -->
    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var currentVideoId = '3JZ_D3ELwOQ'; // ID-ul inițial

        async function fetchPlaylistAndPlay() {
            try {
                let response = await fetch('playlist.json');
                let videos = await response.json();
                if (videos.length > 0) {
                    currentVideoId = videos[0].id;
                    document.getElementById('video-title').innerText = videos[0].title;
                    if (player && player.loadVideoById) {
                        player.loadVideoById(currentVideoId);
                    }
                }
            } catch (e) {
                console.log("Eroare la preluarea listei");
            }
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: currentVideoId,
                playerVars: {
                    'playsinline': 1,
                    'autoplay': 1,
                    'controls': 1,
                    'modestbranding': 1
                },
                events: {
                    'onReady': (event) => {
                        event.target.playVideo();
                        fetchPlaylistAndPlay();
                    }
                }
            });
        }
    </script>
</body>
</html>
