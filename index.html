<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Explore Nature Shorts</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f0f0f;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #000;
        }
        .header {
            padding: 15px;
            text-align: center;
            color: #fff;
            font-size: 16px;
            background: #111;
            font-weight: bold;
        }
        .player-wrapper {
            flex-grow: 1;
            width: 100%;
            position: relative;
            background: #222;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: #111;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: #333;
            cursor: pointer;
        }
        .btn-next {
            background: #2e7d32; /* Verde curat de natură */
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header" id="video-title">Se încarcă Natura...</div>
        
        <div class="player-wrapper" id="player-box">
            <!-- Iframe-ul va fi generat aici -->
        </div>

        <div class="controls">
            <button class="btn" onclick="prevVideo()">Înapoi</button>
            <button class="btn btn-next" onclick="nextVideo()">Următorul ➡️</button>
        </div>
    </div>

    <script>
        let playlist = [];
        let currentIndex = 0;

        async function initApp() {
            try {
                let response = await fetch('playlist.json');
                playlist = await response.json();
                if (playlist.length > 0) {
                    currentIndex = 0;
                    loadVideo();
                } else {
                    document.getElementById('video-title').innerText = "Lista este goală.";
                }
            } catch (e) {
                document.getElementById('video-title').innerText = "Eroare la conectare.";
            }
        }

        function loadVideo() {
            if (playlist.length === 0) return;
            let current = playlist[currentIndex];
            
            document.getElementById('video-title').innerText = current.title;
            
            let container = document.getElementById('player-box');
            // Folosim youtube-nocookie pentru a crește șansele de bypass la restricțiile de embed 
            // și ascundem pe cât posibil interfața YouTube
            container.innerHTML = `
                <iframe 
                    src="https://www.youtube-nocookie.com/embed/${current.id}?autoplay=1&controls=1&modestbranding=1&rel=0&playsinline=1" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            `;
        }

        function nextVideo() {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex + 1) % playlist.length;
            loadVideo();
        }

        function prevVideo() {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadVideo();
        }

        initApp();
    </script>
</body>
</html>
