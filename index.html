<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Safe Nature Shorts</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        .shorts-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #youtube-player {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Mici controale flotante pentru trecere manuală sau swipe */
        .controls-layer {
            position: absolute;
            bottom: 40px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn-control {
            background: rgba(255, 255, 255, 0.25);
            color: white;
            border: none;
            padding: 16px 22px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="shorts-container">
        <!-- Div-ul unde se va încărca playerul oficial YouTube API -->
        <div id="youtube-player"></div>

        <div class="controls-layer">
            <button class="btn-control" onclick="nextShort()">⬇️ Următorul</button>
        </div>
    </div>

    <script>
        let playlist = [];
        let currentIndex = 0;
        let player;

        // Încărcăm scriptul oficial YouTube Iframe API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        async function loadPlaylist() {
            try {
                let response = await fetch('playlist.json');
                playlist = await response.json();
                if (playlist.length > 0 && player) {
                    currentIndex = 0;
                    playCurrent();
                }
            } catch (e) {
                console.log("Eroare la încărcare playlist");
            }
        }

        // Această funcție este apelată automat de YouTube API când e gata
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                videoId: 'Lu34rt8h3EA', // Video inițial de siguranță
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'modestbranding': 1,
                    'loop': 1,
                    'playsinline': 1,
                    'iv_load_policy': 3
                },
                events: {
                    'onReady': (event) => {
                        event.target.playVideo();
                        loadPlaylist(); // După ce e gata playerul, citim fișierul tău
                    },
                    'onStateChange': (event) => {
                        // Când se termină un Short (starea 0), trece automat la următorul!
                        if (event.data === YT.PlayerState.ENDED) {
                            nextShort();
                        }
                    }
                }
            });
        }

        function playCurrent() {
            if (playlist.length === 0 || !player) return;
            let current = playlist[currentIndex];
            player.loadVideoById(current.id);
        }

        function nextShort() {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex + 1) % playlist.length;
            playCurrent();
        }
    </script>
</body>
</html>
