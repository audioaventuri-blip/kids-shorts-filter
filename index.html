<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Skills Feed</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
        }
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        iframe {
            width: 100%;
            max-width: 450px;
            height: 80vh;
            border: none;
            background: #111;
        }
        .info {
            padding: 10px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container" id="player-container">
        <div class="info" id="video-title">Se încarcă conținutul sigur...</div>
        <div id="video-frame"></div>
    </div>

    <script>
        async function loadPlaylist() {
            try {
                let response = await fetch('playlist.json');
                let videos = await response.json();
                
                if (videos.length > 0) {
                    let v = videos[0]; // Încarcă primul video din lista curată
                    document.getElementById('video-title').innerText = v.title;
                    document.getElementById('video-frame').innerHTML = `
                        <iframe src="https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&controls=1&modestbranding=1" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    `;
                }
            } catch (error) {
                document.getElementById('video-title').innerText = "Eroare la încărcarea listei curate.";
            }
        }

        loadPlaylist();
    </script>
</body>
</html>
